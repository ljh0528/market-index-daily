name: daily-report

on:
  schedule:
    # UTC 9:30 = 北京时间 17:30，周一到周五
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑流水线
        run: |
          python fetch.py
          python report.py
          python charts.py
          python page.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
